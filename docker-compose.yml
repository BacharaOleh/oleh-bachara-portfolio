version: "3.9"

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_app
    restart: always
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://nekorom.eu
    networks:
      - fastapi_default

networks:
  fastapi_default:
    external: true
